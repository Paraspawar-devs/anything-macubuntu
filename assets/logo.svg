<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient (macOS Tahoe Dark Glass + Ubuntu Aurora) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="40%" stop-color="#281a36"/>
      <stop offset="75%" stop-color="#3d1e2f"/>
      <stop offset="100%" stop-color="#e95420"/>
    </linearGradient>

    <!-- Glassmorphism Gloss Overlay -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>

    <!-- Apple Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2af598"/>
      <stop offset="100%" stop-color="#009efd"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS Big Sur / Tahoe Squircle Outer Shell -->
  <rect x="36" y="36" width="440" height="440" rx="98" ry="98" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Inner Border Stroke -->
  <rect x="37" y="37" width="438" height="438" rx="97" ry="97" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.2"/>

  <!-- Top Glass Highlight -->
  <path d="M 134 36 L 378 36 C 432 36 476 80 476 134 L 476 256 C 360 220 152 220 36 256 L 36 134 C 36 80 80 36 134 36 Z" fill="url(#glassGloss)"/>

  <!-- Center Artwork: Apple Silhouette fused with Linux Terminal & Architecture Waves -->
  <g transform="translate(256, 260)" filter="url(#glowFilter)">
    <!-- Apple Leaf -->
    <path d="M 4 -120 C 18 -150 48 -168 76 -165 C 78 -135 60 -105 38 -92 C 20 -82 -2 -75 4 -120 Z" fill="url(#leafGrad)"/>

    <!-- Apple Body / Base Silhouette -->
    <path d="M -70 -75
             C -35 -75 -15 -55 0 -55
             C 15 -55 35 -75 70 -75
             C 115 -75 145 -35 145 25
             C 145 75 110 145 70 145
             C 45 145 30 130 0 130
             C -30 130 -45 145 -70 145
             C -110 145 -145 75 -145 25
             C -145 -35 -115 -75 -70 -75 Z"
          fill="#ffffff" fill-opacity="0.94"/>

    <!-- Apple Bite Cutout -->
    <path d="M 85 -5 C 85 -45 115 -75 145 -75 C 130 -35 130 25 145 65 C 115 65 85 35 85 -5 Z" fill="#281a36"/>

    <!-- Linux Terminal Prompt Chevron inside Apple Body -->
    <path d="M -50 -15 L -10 15 L -50 45" fill="none" stroke="#e95420" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Blinking Cursor Line -->
    <line x1="5" y1="45" x2="35" y2="45" stroke="#00f2fe" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Bottom Accent Ribbon: 'ANYTHING-MAC' Minimalist Badge -->
  <g transform="translate(256, 436)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" ry="16" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="3" text-anchor="middle">TAHOE 16 • LINUX</text>
  </g>
</svg>
